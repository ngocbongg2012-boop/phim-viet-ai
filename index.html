<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phim Việt AI</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #141b30;
      --border: #29334d;
      --pink: #ec4899;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 22px;
      background: #10162a;
      border-bottom: 1px solid var(--border);
    }
    .logo { font-size: 21px; font-weight: bold; }
    .logo span { color: var(--pink); }
    main {
      display: grid;
      grid-template-columns: 240px 1fr 280px;
      gap: 16px;
      padding: 16px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }
    .btn {
      background: var(--pink);
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn:hover { opacity: 0.9; }
    video {
      width: 100%;
      border-radius: 8px;
      background: #000;
      max-height: 480px;
    }
    textarea {
      width: 100%;
      height: 120px;
      background: #0d1222;
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      box-sizing: border-box;
      margin-top: 8px;
    }
    input[type="file"] { margin-bottom: 12px; }
  </style>
</head>
<body>

  <header>
    <div class="logo">Phim Việt <span>AI</span></div>
    <div style="font-size: 13px; color: var(--muted);">Công cụ dịch & lồng tiếng video Trung - Việt</div>
  </header>

  <main>
    <!-- Cột trái: Tải file & Công cụ -->
    <aside class="panel">
      <h3>📁 Nguồn đầu vào</h3>
      <input type="file" id="videoInput" accept="video/*" onchange="loadVideo(event)" style="width: 100%;" />
      
      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 12px;">
        <button class="btn" onclick="triggerOCR()">🔍 Quét chữ (Gemini OCR)</button>
      </div>
    </aside>

    <!-- Cột giữa: Trình xem Video & Kết quả Dịch -->
    <section class="panel">
      <video id="videoPlayer" controls></video>
      <canvas id="canvas" style="display:none;"></canvas>

      <h3 style="margin-top: 16px;">📝 Kết quả nhận diện & Dịch thuật</h3>
      <textarea id="resultBox" placeholder="Chữ tiếng Trung quét được và bản dịch Tiếng Việt sẽ hiển thị tại đây..."></textarea>
    </section>

    <!-- Cột phải: Cài đặt AI -->
    <aside class="panel">
      <h3>⚙️ Cài đặt dịch</h3>
      
      <label style="font-size: 12px; color: var(--muted);">Nhập Gemini API Key:</label>
      <div style="display: flex; gap: 6px; margin-top: 4px; margin-bottom: 12px;">
        <input type="password" id="apiKeyInput" placeholder="AIzaSy..." style="flex: 1; padding: 8px; border-radius: 6px; background: #2a2a3a; color: #fff; border: 1px solid #444;" />
        <button class="btn" onclick="connectGemini()">Kết nối</button>
      </div>

      <label style="font-size: 12px; color: var(--muted);">Trạng thái AI:</label>
      <select id="aiModelSelect" style="width: 100%; padding: 8px; border-radius: 6px; background: #2a2a3a; color: #fff; border: 1px solid #444; margin-top: 4px;">
        <option value="">Chưa kết nối AI</option>
      </select>

      <h3 style="margin-top: 24px;">🎙️ Lồng tiếng AI</h3>
      <p style="font-size: 12px; color: var(--muted);">Copy văn bản dịch sau đó dùng trên Vbee Studio để lồng tiếng chuẩn nhất.</p>
    </aside>
  </main>

  <script>
    let isConnected = false;

    function loadVideo(event) {
      const file = event.target.files[0];
      if (file) {
        const videoPlayer = document.getElementById('videoPlayer');
        videoPlayer.src = URL.createObjectURL(file);
      }
    }

    function connectGemini() {
      const key = document.getElementById('apiKeyInput').value.trim();
      const select = document.getElementById('aiModelSelect');
      if (key.length > 10) {
        select.innerHTML = '<option value="gemini-1.5-flash" selected>✅ Gemini 1.5 Flash (Sẵn sàng)</option>';
        isConnected = true;
        alert("Đã kết nối Gemini API thành công!");
      } else {
        alert("Vui lòng nhập API Key hợp lệ!");
      }
    }

    async function triggerOCR() {
      const apiKey = document.getElementById('apiKeyInput').value.trim();
      const video = document.getElementById('videoPlayer');
      const resultBox = document.getElementById('resultBox');

      if (!apiKey || !isConnected) {
        alert("Mày chưa kết nối Gemini API! Hãy dán Key và bấm Kết nối ở cột bên phải trước nhé.");
        return;
      }

      if (!video.src || video.readyState < 2) {
        alert("Vui lòng chọn video trước khi quét chữ!");
        return;
      }

      resultBox.value = "⏳ Đang chụp ảnh màn hình video và gửi cho Gemini 1.5 Flash nhận diện chữ & dịch...";

      // Chụp khung hình hiện tại của video
      const canvas = document.getElementById('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      const base64Image = canvas.toDataURL('image/jpeg').split(',')[1];

      // Gửi sang Gemini API
      try {
        const response = await fetch(https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: "Đọc tất cả chữ tiếng Trung xuất hiện trong hình ảnh này và dịch toàn bộ sang tiếng Việt mượt mà tự nhiên. Trả về định dạng: \n- Chữ gốc: ...\n- Bản dịch: ..." },
                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
              ]
            }]
          })
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          resultBox.value = data.candidates[0].content.parts[0].text;
        } else {
          resultBox.value = "Không tìm thấy chữ hoặc có lỗi xảy ra từ API. Chi tiết: " + JSON.stringify(data);
        }
      } catch (err) {
        resultBox.value = "Lỗi kết nối API: " + err.message;
      }
    }
  </script>
</body>
</html>

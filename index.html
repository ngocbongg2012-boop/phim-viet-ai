<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phim Việt AI</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0b1020;
  --panel: #141b30;
  --border: #29334d;
  --pink: #ec4899;
  --text: #f1f5f9;
  --muted: #94a3b8;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  font-size: 14px;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 22px;
  background: #10162a;
  border-bottom: 1px solid var(--border);
}
.logo { font-size: 21px; font-weight: bold; }
.logo span { color: var(--pink); }
.status { color: #86efac; font-size: 12px; }
main {
  display: grid;
  grid-template-columns: 220px minmax(0, 1fr) 230px;
  gap: 12px;
  padding: 14px;
}
.panel, .workspace {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  min-width: 0;
}
h3 { margin: 0 0 14px; font-size: 14px; }
label { display: block; margin: 13px 0 7px; color: #cbd5e1; }
button, select, input, textarea {
  font: inherit;
  border-radius: 7px;
}
button {
  border: 1px solid var(--border);
  padding: 10px 12px;
  background: #222c45;
  color: white;
  cursor: pointer;
}
button:hover { border-color: var(--pink); }
.primary { background: var(--pink); border-color: var(--pink); }
.green { background: #15803d; }
select, input[type="text"], input[type="password"], textarea {
  width: 100%;
  padding: 10px;
  background: #0c1326;
  border: 1px solid var(--border);
  color: white;
}
input[type="file"] { max-width: 100%; font-size: 12px; }
.small { color: var(--muted); font-size: 12px; line-height: 1.6; }
.workspace { min-height: 520px; }
.video-box {
  min-height: 280px;
  background: #080d19;
  border: 1px dashed #46516c;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 14px;
  padding: 14px;
  text-align: center;
}
video { width: 100%; max-height: 420px; }
.tabs { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 14px; }
#subtitles { width: 100%; min-height: 150px; resize: vertical; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
footer { padding: 15px; text-align: center; color: var(--muted); }
@media (max-width: 850px) {
  main { grid-template-columns: 1fr; }
  .workspace { order: -1; }
  header { padding: 13px; }
}
</style>
</head>
<body>
<header>
  <div class="logo">🎬 Phim <span>Việt AI</span></div>
  <div class="status">● Bản thử nghiệm</div>
</header>

<main>
  <aside class="panel">
    <h3>📂 Phụ đề & tệp</h3>
    <label>Chọn video</label>
    <input id="videoFile" type="file" accept="video/*">
    <p class="small">Video được mở trên trình duyệt của bạn.</p>
    <label>Nhập file phụ đề SRT</label>
    <input id="srtFile" type="file" accept=".srt,.vtt,.txt">
    <div class="actions">
      <button id="loadSrt">Nạp phụ đề</button>
    </div>
    <label>Ngôn ngữ nguồn</label>
    <select><option>Tiếng Trung</option><option>Tiếng Việt</option></select>
    <label>Ngôn ngữ đích</label>
    <select><option>Tiếng Việt</option><option>Tiếng Anh</option></select>
  </aside>

  <section class="workspace">
    <div class="tabs">
      <button class="primary">🎞 Video</button>
      <button onclick="document.getElementById('srtFile').click()">📄 SRT</button>
      <button id="btnOcr" class="primary" style="font-weight: bold;">🔎 Quét chữ (Gemini OCR)</button>
      <button onclick="alert('Nhận diện âm thanh sẽ được bổ sung ở bước tiếp theo.')">🎙 Nhận diện giọng nói</button>
    </div>
    <div class="video-box" id="videoBox">
      <div style="font-size:38px">🎬</div>
      <strong>Chọn video để bắt đầu</strong>
      <span class="small">MP4 · MOV · WEBM</span>
      <button class="primary" onclick="document.getElementById('videoFile').click()">Chọn video</button>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>

    <label style="margin-top: 14px;">Văn bản phụ đề — có thể chỉnh sửa</label>
    <textarea id="subtitles" placeholder="Nội dung SRT hoặc bản dịch quét từ video sẽ xuất hiện ở đây..."></textarea>
    <div class="actions">
      <button id="downloadSrt" class="green">⬇ Xuất file SRT</button>
      <button onclick="document.getElementById('subtitles').value=''">Xóa nội dung</button>
    </div>
  </section>

  <aside class="panel">
    <h3>⚙️ Cài đặt dịch</h3>
    <label>Phong cách bản dịch</label>
    <select id="translateStyle">
      <option value="Tự nhiên, thuần Việt">Tự nhiên, thuần Việt</option>
      <option value="Ngôn tình hiện đại">Ngôn tình hiện đại</option>
      <option value="Cổ trang">Cổ trang</option>
      <option value="Phụ đề ngắn gọn">Phụ đề ngắn gọn</option>
    </select>
    
    <label style="font-weight: bold; margin-top: 10px; display: block;">Mô hình dịch</label>
    <div style="margin-top: 6px;">
      <label style="font-size: 12px; color: #ccc; margin: 0 0 4px; display: block;">Nhập Gemini API Key:</label>
      <input type="password" id="apiKeyInput" placeholder="AIzaSy..." />
      <button type="button" onclick="connectGemini()" class="primary" style="width: 100%; margin-top: 6px; font-weight: bold;">Kết nối AI</button>
    </div>
    <select id="aiModelSelect" style="margin-top: 8px;">
      <option value="">Chưa kết nối AI</option>
    </select>

    <h3 style="margin-top:24px">🎧 Lồng tiếng AI</h3>
    <label>Giọng đọc</label>
    <select><option>Chưa kết nối giọng đọc</option><option>Giọng nữ</option><option>Giọng nam</option></select>
    <label>Tốc độ đọc</label>
    <select><option>1x — Bình thường</option><option>0.8x — Chậm</option><option>1.2x — Nhanh</option></select>
    <button style="width:100%;margin-top:12px" onclick="alert('Chức năng lồng tiếng sẽ được tích hợp ở bước sau.')">🎙 Tạo giọng đọc</button>
  </aside>
</main>
<footer>Phim Việt AI · Công cụ dịch phim Trung–Việt</footer>

<script>
let activeVideo = null;
let isGeminiConnected = false;

const videoInput = document.getElementById('videoFile');
const videoBox = document.getElementById('videoBox');
const srtInput = document.getElementById('srtFile');
const subtitles = document.getElementById('subtitles');

videoInput.addEventListener('change', () => {
  const file = videoInput.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  videoBox.innerHTML = '';
  activeVideo = document.createElement('video');
  activeVideo.controls = true;
  activeVideo.src = url;
  videoBox.appendChild(activeVideo);
});

document.getElementById('loadSrt').addEventListener('click', async () => {
  const file = srtInput.files[0];
  if (!file) {
    alert('Hãy chọn một file SRT trước nhé.');
    return;
  }
  subtitles.value = await file.text();
});

document.getElementById('downloadSrt').addEventListener('click', () => {
  const blob = new Blob([subtitles.value], {
    type: 'text/plain;charset=utf-8'
  });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'phu-de-viet.srt';
  a.click();
  URL.revokeObjectURL(url);
});

function connectGemini() {
  const key = document.getElementById('apiKeyInput').value.trim();
  const select = document.getElementById('aiModelSelect');
  if (key.length > 10) {
    select.innerHTML = '<option value="gemini-1.5-flash" selected>✅ Gemini 1.5 Flash (Đã kết nối)</option>';
    isGeminiConnected = true;
    alert("Đã kết nối Gemini API thành công!");
  } else {
    alert("Vui lòng nhập API Key hợp lệ!");
  }
}

document.getElementById('btnOcr').addEventListener('click', async () => {
  const apiKey = document.getElementById('apiKeyInput').value.trim();
  const style = document.getElementById('translateStyle').value;

  if (!apiKey || !isGeminiConnected) {
    alert("Mày chưa kết nối Gemini API! Vui lòng dán Key và bấm Kết nối AI ở cột phải trước.");
    return;
  }

  if (!activeVideo || activeVideo.readyState < 2) {
    alert("Vui lòng chọn video trước khi quét chữ!");
    return;
  }

  subtitles.value = "⏳ Đang chụp ảnh video và gửi sang Gemini 1.5 Flash để quét chữ Trung & dịch...";

  const canvas = document.getElementById('canvas');
  canvas.width = activeVideo.videoWidth || 640;
  canvas.height = activeVideo.videoHeight || 360;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(activeVideo, 0, 0, canvas.width, canvas.height);
  
  const base64Image = canvas.toDataURL('image/jpeg').split(',')[1];

  try {
    const response = await fetch(https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{
          parts: [
            { text: Đọc tất cả chữ tiếng Trung xuất hiện trong hình ảnh này và dịch sang tiếng Việt theo văn phong "${style}". Trả về kết quả rõ ràng: \n- Chữ gốc tiếng Trung: ...\n- Bản dịch tiếng Việt: ... },
            { inline_data: { mime_type: "image/jpeg", data: base64Image } }
          ]
        }]
      })
    });

    const data = await response.json();
    if (data.candidates && data.candidates[0].content.parts[0].text) {
      subtitles.value = data.candidates[0].content.parts[0].text;
    } else {
      subtitles.value = "Không tìm thấy chữ hoặc có lỗi xảy ra. Chi tiết: " + JSON.stringify(data);
    }
  } catch (err) {
    subtitles.value = "Lỗi kết nối Gemini API: " + err.message;
  }
});
</script>
</body>
</html>
